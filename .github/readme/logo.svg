<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-60 -40 1144 1164">
  <!-- The Deckmux icon (Icon Composer layers), with the eyes alive: they look
       left, right, back, then blink. Same drawing as the presentation video. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#353B47"/><stop offset="1" stop-color="#11141B"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A616E"/><stop offset="1" stop-color="#2A2E36"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2A40"/><stop offset="1" stop-color="#070D18"/></linearGradient>
    <radialGradient id="glow" cx="512" cy="530" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.26"/><stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.06"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.42"/><stop offset="0.45" stop-color="#22D3EE" stop-opacity="0.14"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DF4FF"/><stop offset="0.5" stop-color="#25D8F5"/><stop offset="1" stop-color="#03A9D9"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity="0.38"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="sheen" x1="166" y1="236" x2="520" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFF" stop-opacity="0.09"/><stop offset="0.7" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <clipPath id="screen-clip"><rect x="166" y="236" width="692" height="560" rx="150"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <style>
    .look { animation: look 6s cubic-bezier(.3,.7,.2,1) infinite; }
    .blink { transform-box: view-box; transform-origin: 512px 530px; animation: blink 6s ease-in-out infinite; }
    @keyframes look {
      0%, 16% { transform: translateX(0); }
      21%, 33% { transform: translateX(-63px); }
      40%, 50% { transform: translateX(63px); }
      56%, 100% { transform: translateX(0); }
    }
    @keyframes blink {
      0%, 60% { transform: scaleY(1); }
      61.5% { transform: scaleY(0.1); }
      63%, 76% { transform: scaleY(1); }
      77.5% { transform: scaleY(0.1); }
      79%, 80.5% { transform: scaleY(1); }
      82% { transform: scaleY(0.1); }
      83.5%, 100% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) { .look, .blink { animation: none; } }
  </style>

  <!-- body -->
  <rect x="40" y="40" width="944" height="944" rx="214" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="42" y="42" width="940" height="940" rx="212" fill="none" stroke="#FFF" stroke-opacity="0.10" stroke-width="4"/>

  <!-- bezel -->
  <rect x="152" y="222" width="720" height="588" rx="164" fill="url(#bezel)"/>
  <rect x="155" y="225" width="714" height="582" rx="161" fill="none" stroke="#FFF" stroke-opacity="0.45" stroke-width="4"/>

  <!-- screen -->
  <g clip-path="url(#screen-clip)">
    <rect x="166" y="236" width="692" height="560" fill="url(#screen)"/>
    <g class="look">
      <rect x="40" y="150" width="944" height="760" fill="url(#glow)"/>
      <ellipse cx="426" cy="530" rx="118.8" ry="151.2" fill="url(#halo)"/>
      <ellipse cx="598" cy="530" rx="118.8" ry="151.2" fill="url(#halo)"/>
    </g>
    <rect x="166" y="236" width="692" height="64" fill="url(#recess)"/>
    <path d="M262 320 L280 336 L262 352 M296 352 H326" fill="none" stroke="#5FE6F7" stroke-opacity="0.5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="look">
      <g class="blink">
        <rect x="382" y="446" width="88" height="168" rx="44" fill="url(#eye)"/>
        <rect x="396" y="456" width="60" height="64" rx="30" fill="url(#shine)"/>
        <rect x="554" y="446" width="88" height="168" rx="44" fill="url(#eye)"/>
        <rect x="568" y="456" width="60" height="64" rx="30" fill="url(#shine)"/>
      </g>
    </g>
    <path d="M166 236 H664 L373 583 H166 Z" fill="url(#sheen)"/>
  </g>
  <rect x="166" y="236" width="692" height="560" rx="150" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="10"/>
</svg>
