name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build e testes
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # GhosttyKit is a ~250 MB prebuilt download pinned by scripts/ghostty.env.
      - name: Cache do GhosttyKit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deckmux/ghosttykit
          key: ghosttykit-${{ hashFiles('scripts/ghostty.env') }}

      - name: Build do app (release)
        run: scripts/build-app.sh release

      - name: Testes
        run: swift test
